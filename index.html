<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A78D6">
<title>Thank You · 2026 Reflection, 2027 Forward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&family=Sriracha&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--cyan:#3FE0F5;--gold:#FFC56E;--coral:#FF8C69;--paper:#FFF7E6;--ink:#F2F6FF;--ink2:#B4C3E3;--line:rgba(150,200,255,.22);--card:rgba(10,40,110,.62);--navy:#021338;--warn:#FFB38A;
  --hand:"Sriracha","Kanit",cursive;--emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Kanit",system-ui,sans-serif;font-weight:300;background:#2A78D6;color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:500}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ===== background: banner style + a warm horizon ===== */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(120deg,#1F55B8 0%,#2A78D6 38%,#38A0E6 68%,#5CCBF2 100%)}
#bg .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(110,180,255,.34) 1.1px,transparent 1.7px);background-size:14px 14px;-webkit-mask-image:linear-gradient(115deg,transparent 12%,#000 48%,rgba(0,0,0,.6) 70%,transparent 92%);mask-image:linear-gradient(115deg,transparent 12%,#000 48%,rgba(0,0,0,.6) 70%,transparent 92%)}
#bg .glow{position:absolute;right:-12vw;bottom:-25vh;width:75vw;height:75vh;background:radial-gradient(closest-side,rgba(63,224,245,.3),rgba(63,224,245,0))}
#bg .dawn{position:absolute;left:-30%;right:-30%;bottom:-35vh;height:75vh;background:radial-gradient(ellipse at 50% 100%,rgba(255,197,110,.5),rgba(255,140,105,.16) 45%,rgba(255,140,105,0) 70%)}
#bg .tri{position:absolute;clip-path:polygon(0 0,100% 50%,0 100%);background:linear-gradient(135deg,rgba(63,224,245,.26),rgba(63,224,245,.02))}
#bg .t1{width:34vw;height:34vw;right:8vw;bottom:-6vw;transform:rotate(-14deg)}
#bg .t2{width:16vw;height:16vw;left:30vw;top:-4vw;transform:rotate(22deg);opacity:.5}
#bg .t3{width:22vw;height:22vw;left:-6vw;bottom:8vh;transform:rotate(190deg);opacity:.3}
#bg .streak{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(63,224,245,0),#BFF8FF 60%,rgba(63,224,245,0));box-shadow:0 0 18px 4px rgba(63,224,245,.4)}
#bg .s1{width:30vw;left:6vw;top:34vh;transform:rotate(-8deg);opacity:.7}
#bg .s2{width:18vw;right:4vw;top:16vh;transform:rotate(-8deg);opacity:.5}
body.screen #bg .dawn{display:none}
#sky{position:fixed;inset:0;z-index:1;display:none;transition:opacity 1s}
body.screen #sky{display:block}
body[data-stage="groups"] #sky{opacity:.25}
#app{position:relative;z-index:2}

/* ===== type ===== */
.disp{font-family:"Bebas Neue","Kanit",sans-serif;font-weight:400;letter-spacing:.02em;line-height:.95}
.hand{font-family:var(--hand);font-weight:400}
.kick{font-family:"Bebas Neue","Kanit",sans-serif;letter-spacing:.16em;color:var(--cyan);font-size:17px}
.en{display:block;font-size:.8em;font-weight:300;opacity:.75;line-height:1.35}
.muted{color:var(--ink2)}
.hint{color:var(--ink2);font-size:13px;margin:10px 0 0}
h1,h2{font-weight:500;margin:0 0 8px}
h1{font-size:28px;line-height:1.2}
h2{font-size:21px;line-height:1.3}
.hello{font-family:var(--hand);font-size:46px;color:var(--gold);line-height:1.1;text-shadow:0 0 26px rgba(255,197,110,.35)}
.cfg{background:rgba(255,140,90,.14);border:1px solid rgba(255,170,130,.5);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.err{color:var(--warn);font-size:14px;margin:8px 0 0}
.saved{color:#9FF0CF;font-size:14px}
.center{text-align:center}

/* ===== avatar (character + head item) ===== */
.av{position:relative;display:inline-block;line-height:1;font-family:var(--emoji);vertical-align:middle;padding-top:.42em;font-style:normal}
.av i{font-style:normal;display:block}
.av .h{position:absolute;left:50%;top:0;font-size:.56em;transform:translateX(-50%) rotate(-10deg)}

/* ===== paper thank-you note ===== */
.note{position:relative;background:var(--paper);color:#1E1846;border-radius:6px;padding:16px 18px 12px;box-shadow:0 16px 30px -12px rgba(0,0,0,.6);transform:rotate(var(--rot,0deg));margin:14px 2px 18px}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:86px;height:20px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.5);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note .to{font-family:var(--hand);font-size:18px;color:#3B3466;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note .to b{font-weight:400;color:#1E1846}
.note p{font-family:var(--hand);font-size:20px;line-height:1.5;margin:6px 0 8px;color:#1E1846;word-break:break-word}
.note .from{font-family:var(--hand);font-size:16px;color:#5B5680;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stamp{margin-left:auto;font-family:"Kanit",sans-serif;font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--td,#A8650A);border:1.5px solid var(--td,#A8650A);border-radius:6px;padding:1px 8px;transform:rotate(-4deg);white-space:nowrap}

/* ===== phone ===== */
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;min-height:40px}
.toprt{display:flex;align-items:center;gap:8px}
.mechip{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.offpill{display:none;font-size:12px;color:var(--warn);border:1px solid rgba(255,179,138,.5);border-radius:999px;padding:2px 10px;white-space:nowrap}
body.offline .offpill{display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero{text-align:center;padding:12px 4px 14px}
.hero h1.disp{font-size:30px;margin:6px 0 8px}
.hero.join{padding:28px 8px 26px}
.hero.join h1.disp{font-size:40px;line-height:1.05;margin:0 0 18px}
.hero.join h1.disp span{font-size:28px;margin-top:12px}
.hero.join p{margin:0;font-size:16px}
.hero h1.disp span{color:var(--cyan);display:block}
label{display:block;font-weight:400;margin:12px 0 6px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;border:1.5px solid rgba(150,200,255,.35);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.06);min-height:48px;color:#fff}
input::placeholder,textarea::placeholder{color:rgba(200,220,255,.45)}
textarea{min-height:96px;resize:vertical}
textarea.paper{background-color:var(--paper);color:#1E1846;font-family:var(--hand);font-size:19px;line-height:32px;border:0;border-radius:6px;padding:8px 14px;min-height:150px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(42,33,80,.14) 31px,rgba(42,33,80,.14) 32px);background-attachment:local;box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
textarea.paper::placeholder{color:rgba(42,33,80,.42)}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:500;background:var(--gold);color:#3A1A00;min-height:50px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.preview{text-align:center;padding:4px 0 6px}
.preview .nm{font-family:var(--hand);font-size:22px;margin-top:2px;min-height:1.5em}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.pick button{aspect-ratio:1;border:2px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;font-size:26px;display:grid;place-items:center;padding:0;font-family:var(--emoji)}
.pick button[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,197,110,.18);box-shadow:0 0 18px -4px var(--gold)}
.pick button.none{font-family:"Kanit",sans-serif;font-size:12px;line-height:1.2;color:var(--ink2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tabs button{border:1.5px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:10px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#3A1A00;border-color:var(--gold)}
.banner{background:rgba(255,197,110,.12);border:1px solid rgba(255,197,110,.45);border-radius:14px;padding:10px 14px;margin-bottom:14px;text-align:center}
.step{display:flex;align-items:flex-start;gap:10px;font-weight:500;margin:18px 0 8px}
.step:first-child{margin-top:0}
.step .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3A1A00;display:grid;place-items:center;font-size:14px}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:8px 12px;min-height:48px}
.sugg button small{color:var(--ink2);font-size:13px;text-align:right}
.sugg button.ext{border-style:dashed}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--gold);background:rgba(255,197,110,.1);border-radius:12px;padding:8px 12px;font-weight:500}
.picked small{display:block;font-weight:300;color:var(--ink2);font-size:13px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink2)}
.tagb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.tagb .ic,.tline .ic,.trow .ic{font-family:var(--emoji);line-height:1}
.tagb .ic{font-size:30px}
.tagb b{display:block;font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:26px;letter-spacing:.06em;color:var(--tc);line-height:1}
.tagb small{display:block;color:var(--ink2);font-size:13px}
.tagb[aria-pressed="true"]{border-color:var(--tc);box-shadow:0 0 24px -6px var(--tc);background:rgba(255,255,255,.08)}
.tline{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--tc);padding:4px 0 4px 12px;margin:10px 0}
.tline .ic{font-size:24px;padding-top:2px}
.tline b{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:22px;letter-spacing:.06em;color:var(--tc);margin-right:6px}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-left:3px solid var(--tc);padding:6px 0 6px 12px;margin-top:12px}
.mini p{margin:2px 0 0;color:var(--ink2);font-size:15px;font-family:var(--hand)}
.mini .tg{font-family:"Bebas Neue",sans-serif;letter-spacing:.08em;color:var(--tc)}
.gcard{background:var(--gc);color:#21123A;border-radius:22px;padding:22px;text-align:center;margin-bottom:14px;box-shadow:0 0 50px -10px var(--gc)}
.gcard .kick{color:#21123A;opacity:.75}
.gname{font-size:72px;line-height:.9;margin-top:6px}
.gcard.slim .gname{font-size:48px}
.gcard .cd{font-family:"Bebas Neue",sans-serif;font-size:44px;line-height:1;margin-top:8px}
.prompts{padding-left:22px;margin:10px 0 0}
.prompts li{margin-bottom:10px;font-size:20px;font-family:var(--hand)}
.prompts b{color:var(--gold);font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:24px;letter-spacing:.04em;margin-right:4px}
.prompts .en{font-family:"Kanit",sans-serif;font-size:13px}
.mestar{text-align:center;line-height:1}
.mem{padding-left:22px;margin:8px 0 0}
.mem li{padding:4px 0}
.mem li.on{color:var(--gold);font-weight:500}
.mem small{display:block;color:var(--ink2);font-size:13px;font-weight:300}
.cheer ol{padding-left:20px;margin:8px 0}
.cheer li{margin-bottom:8px}
.shout{font-size:54px;color:var(--gold);text-align:center;text-shadow:0 0 26px rgba(255,197,110,.5);margin-top:8px}
#toast{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:50;max-width:520px;margin:0 auto;transform:translateY(160%);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#toast.on{transform:none}
#toast>div{background:rgba(2,12,40,.94);border:1px solid rgba(255,197,110,.55);border-radius:20px;padding:12px 14px 2px;box-shadow:0 0 44px -8px rgba(255,197,110,.65);cursor:pointer}
.toast-h{font-weight:500;text-align:center;font-size:18px}
.toast-h small{display:block;font-weight:300;font-size:13px;color:var(--ink2)}

/* phones up: every phone becomes a warm light */
body.pu{--g:.6}
body.pu #bg{background:radial-gradient(circle at 50% 42%,#FFF6DD 0%,#FFD48A 28%,#FFA563 56%,#B4507A 82%,#2A1C5C 100%)}
body.pu #bg .glow{left:50%;top:42%;right:auto;bottom:auto;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0) 55%);opacity:var(--g)}
body.pu #bg .dots,body.pu #bg .tri,body.pu #bg .streak,body.pu #bg .dawn{opacity:.2}
.pu-wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3A1500;padding:10px}
.pu-t{font-size:min(30vw,170px)}
.pu-h2{font-size:21px;margin-top:6px;color:#5A2400;text-wrap:balance}
.pu-s{font-size:min(8vw,40px);margin-top:10px}
.pu-h{margin-top:22px;font-weight:500;font-size:18px;background:rgba(58,21,0,.86);color:#FFF3D6;border-radius:999px;padding:8px 18px}

/* ===== big screen ===== */
body.screen{overflow:hidden;height:100vh}
body.screen .wrap{max-width:none;padding:0}
.sh{position:fixed;left:40px;top:22px;z-index:5}
.sh-t{font-size:32px;margin-top:2px}
.sh-t span{color:var(--gold)}
.panel{position:fixed;z-index:4}
.lobbyL{left:40px;top:110px;bottom:90px;width:min(44vw,760px);display:flex;flex-direction:column;justify-content:center}
.lobbyL .hello{font-size:64px}
.mega{font-size:min(6.2vw,9.4vh);margin:8px 0 22px}
.mega span{color:var(--cyan);text-shadow:0 0 30px rgba(63,224,245,.45)}
.qrbox{display:flex;align-items:center;gap:22px;background:rgba(10,40,110,.5);border:1px solid var(--line);border-radius:22px;padding:14px;max-width:640px}
.qrbox [data-qr]{background:#fff;padding:10px;border-radius:14px;flex:none}
.qrbox b{font-size:24px;display:block;line-height:1.3}
.qrbox .en{font-size:17px}
.url{margin-top:8px;font-size:15px;color:var(--cyan);word-break:break-all}
.here{right:40px;top:22px;display:flex;gap:10px}
.stat{font-size:16px;color:var(--ink2);background:rgba(10,40,110,.45);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.stat b{font-family:"Bebas Neue",sans-serif;font-size:24px;color:#fff;font-weight:400;margin-right:4px}
.tpanel{left:40px;top:110px;width:400px;background:rgba(10,40,110,.5);border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.tpanel .prompt{font-size:24px;line-height:1.35;margin:4px 0 6px;color:#FFE7BF}
.trow{display:flex;align-items:center;gap:12px;margin-top:8px}
.trow .ic{font-size:28px}
.trow .d{flex:1;font-size:15px;color:var(--ink2);line-height:1.3}
.trow .d b{display:block;font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:25px;letter-spacing:.06em;color:var(--tc);line-height:1}
.trow em{font-style:normal;font-family:"Bebas Neue",sans-serif;font-size:30px;color:#fff}
.total{display:flex;align-items:center;gap:12px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.total b{font-size:60px;color:#fff;line-height:.9;text-shadow:0 0 24px rgba(255,197,110,.5)}
.total span{font-size:16px;line-height:1.3}
.total small{color:var(--ink2)}
.total [data-qr]{margin-left:auto;background:#fff;padding:5px;border-radius:8px;flex:none}
.notes{right:40px;top:96px;width:430px;max-height:calc(60vh - 110px);overflow:hidden;padding:6px 4px 0}
.notes .note{animation:dropin .7s cubic-bezier(.2,1.2,.4,1)}
.spothead{left:0;right:0;top:70px;text-align:center}
.spothead h1{font-size:min(5.2vw,8vh);margin:4px 0 0;text-shadow:0 0 30px rgba(255,197,110,.35)}
.spothead .hand{font-size:32px;color:var(--gold)}
.spot{position:fixed;z-index:8;left:50%;top:51%;transform:translate(-50%,-50%);width:min(1000px,80vw);animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
.note.big{padding:34px 46px 26px}
.note.big::before{width:140px;height:28px;top:-14px}
.note.big .to{font-size:34px}
.note.big p{font-size:clamp(28px,2.8vw,50px);margin:12px 0 16px}
.note.big .from{font-size:26px}
.note.big .stamp{font-size:16px}
.standup{text-align:center;margin-top:16px;padding-top:12px;border-top:1.5px dashed rgba(42,33,80,.2);font-size:26px;font-weight:500;color:#C2410C}
.gwrap{left:40px;right:40px;top:104px;bottom:80px;display:flex;flex-direction:column;gap:16px}
.gh{background:rgba(10,40,110,.55);border:1px solid var(--line);border-radius:22px;padding:16px 26px}
.gh h1.disp{font-size:min(5.6vw,8vh);margin:0}
.gh p{font-size:22px;margin:6px 0 0}
.ghrow{display:flex;align-items:center;gap:30px}
.cd.big{font-family:"Bebas Neue",sans-serif;font-size:min(5.6vw,8vh);color:var(--gold);line-height:1}
.cd.out{color:var(--warn);animation:blink 1s infinite}
.prompts2{display:flex;gap:30px;flex-wrap:wrap;font-size:24px;margin-top:8px;align-items:flex-start;font-family:var(--hand)}
.prompts2 b{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:32px;color:var(--gold);margin-right:6px}
.prompts2 .en{font-family:"Kanit",sans-serif;font-size:15px}
.star-says{color:#FFE7BF}
.gg{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-content:start}
.gc{background:var(--paper);color:#1E1846;border-radius:12px;border-top:10px solid var(--gc);padding:8px 14px 10px;font-size:16px;box-shadow:0 10px 22px -12px rgba(0,0,0,.6)}
.gc .gn{font-size:28px;color:#1E1846}
.gc div.on{color:#B45309;font-weight:500}
.cheerL{left:40px;top:70px;width:min(46vw,800px)}
.cheerL .hello{font-size:56px}
.mega2{font-size:min(5vw,8vh);margin:6px 0 6px}
.cheerL .shout{text-align:left;font-size:min(3.4vw,5.6vh)}
.cheerL p{font-size:22px;margin:8px 0 0}
.words{position:fixed;left:50vw;right:30px;top:110px;bottom:100px;z-index:4;pointer-events:none}
.w{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--hand);animation:float 6s ease-in-out infinite;text-shadow:0 0 18px currentColor}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-14px}}
.fin{position:fixed;left:0;right:0;top:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;pointer-events:none;background:radial-gradient(ellipse 55% 60% at 50% 50%,rgba(2,10,38,.62),rgba(2,10,38,0))}
.fin-t{font-size:min(11vw,15vh);text-shadow:0 0 50px rgba(255,197,110,.55)}
.fin-s{font-size:min(3.4vw,5.2vh)}
.fin-s span{color:var(--gold)}
.km{max-width:860px;font-size:clamp(18px,1.5vw,25px);line-height:1.45;margin:14px 0 6px}
.km b{color:var(--gold)}
.km .th{display:block;font-size:.85em;color:var(--ink2);margin-top:4px}
.fin-n{font-size:26px;color:#FFE7BF}
.pu-call{margin-top:12px;font-size:40px;background:var(--gold);color:#3A1500;padding:6px 28px 2px;border-radius:999px;animation:pulse 1.6s ease-in-out infinite}
.qrbig{position:fixed;inset:0;z-index:9;background:rgba(2,10,38,.86);display:grid;place-items:center}
.qrbig>div{background:#fff;border-radius:26px;padding:26px;text-align:center;color:var(--navy)}
.qrbig b{display:block;font-size:26px;margin-top:10px}
.ctl{position:fixed;right:14px;bottom:12px;z-index:10;display:flex;gap:6px;align-items:center;background:rgba(2,10,38,.9);border:1px solid var(--line);border-radius:16px;padding:6px;opacity:.3;transition:opacity .25s;max-width:calc(100vw - 28px);flex-wrap:wrap;justify-content:flex-end}
.ctl:hover,.ctl:focus-within{opacity:1}
.ctl button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:6px 11px;min-height:38px;font-size:14px}
.ctl button.danger{color:var(--warn)}
.ctl .lbl{font-weight:500;padding:0 6px;font-size:14px}
.ctl input{width:140px;min-height:38px;padding:6px 10px}
.ctl .msg{font-size:13px;color:#9FF0CF;padding:0 6px}
.livedot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);padding:0 6px;white-space:nowrap}
.livedot i{width:8px;height:8px;border-radius:50%;background:#7C8AA5;display:block}
.livedot.on i{background:#3FF5B0}

@keyframes pop{from{opacity:0;transform:translate(-50%,-44%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes dropin{from{opacity:0;transform:translateY(-24px) rotate(var(--rot,0deg))}to{opacity:1;transform:rotate(var(--rot,0deg))}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{50%{opacity:.4}}
@media (max-width:900px){body.screen{overflow:auto;height:auto}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="dots"></div><div class="glow"></div><div class="dawn"></div><div class="tri t1"></div><div class="tri t2"></div><div class="tri t3"></div><div class="streak s1"></div><div class="streak s2"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app"><div class="wrap"><p class="muted">กำลังเชื่อมต่อ… · Connecting…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== ใส่ URL ของ Apps Script Web App ตรงนี้ · Paste the Apps Script Web App URL here ===== */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbzQz_wGgtfxvkCLqbftslBmj5HY-rOhMmiEWM1IQrtoBfTM3GgkFiF_deIJZjK2rPaN/exec';

const QS = new URLSearchParams(location.search);
const API = QS.get('api') || API_DEFAULT;
const VER = 'v2';
const TAGS = {
  STRONGER: { c: '#FFC56E', d: '#A8650A', ic: '🤝', hr: '💛', en: 'Supported one another', th: 'ซัพพอร์ตกัน จนทีมแข็งแรงขึ้น', ph: 'ขอบคุณที่อยู่ข้าง ๆ กัน ตอนที่…' },
  FASTER: { c: '#FF8C69', d: '#C2410C', ic: '🙋', hr: '🧡', en: 'Stepped up', th: 'ลุกขึ้นมารับผิดชอบ ลงมือก่อน', ph: 'ขอบคุณที่ลุกขึ้นมา… ตอนที่…' },
  BETTER: { c: '#3FE0F5', d: '#0B7F92', ic: '💡', hr: '💙', en: 'Found a better way', th: 'หาวิธีที่ดีกว่าเดิม ทำให้งานดีขึ้น', ph: 'ขอบคุณที่คิดวิธีใหม่… ทำให้…' }
};
const TK = Object.keys(TAGS);
const tg = g => TAGS[g] || TAGS.STRONGER;
const CHARS = ['🦁', '🐯', '🦊', '🐼', '🐨', '🐻', '🐸', '🐵', '🦉', '🐧', '🐰', '🐶', '🐱', '🦄', '🐷', '🐮', '🐙', '🦖', '🐳', '🐝', '🦋', '🐢', '🦒', '🐲'];
const HATS = ['👑', '🎩', '🧢', '🎓', '⛑️', '🎀', '🌸', '🌻', '⭐', '💡', '🔥', '🚀', '🎧', '🌈', '🍀', '🎉', '⚡', '🪐'];
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const STEPS = [
  { stage: 'lobby', label: 'เข้าห้อง · Lobby' },
  { stage: 'thanks', label: 'เขียนโน้ต · Thanks' },
  { stage: 'spot', label: 'Spotlight' },
  { stage: 'groups', label: 'กลุ่มเล็ก · Groups' },
  { stage: 'cheer', label: 'Cheer 2027' },
  { stage: 'finale', label: 'Phones Up' },
  { stage: 'end', label: 'ปิด · Close' }
];
const GCOL = ['#FFC56E', '#FF8C69', '#3FE0F5', '#7EF0C9', '#C9A7FF', '#FF7AB6', '#8FB8FF', '#B8F55A'];
const TURN_SEC = 75;
const MAX_SENT = 12;

const view = () => location.hash.slice(1) === 'screen' ? 'screen' : 'me';
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const S = { st: { stage: 'lobby' }, players: [], me: null, loaded: false, pid: lsGet('rf27_pid'), key: lsGet('rf27_key'), admin: false, editing: false,
  d: {}, tab: 'send', busy: false, err: '', flash: '', total: 0, byTag: {}, edges: [], words: [], groups: [], off: 0, showQR: false, shown: new Set() };
const maxTurn = () => Math.max(4, ...(S.groups || []).map(g => g.members.length));
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const draft = (k, def) => (k in S.d ? S.d[k] : (def || ''));
function hash(s) {
  let h = 2166136261; s = String(s);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16; // mix, so similar keys land far apart
  return (h >>> 0) / 4294967295;
}
const rot = k => ((hash(k) - 0.5) * 3.2).toFixed(2);
const av = (icon, hat, size) => icon ? `<span class="av" style="font-size:${size}px" aria-hidden="true">${hat ? `<i class="h">${esc(hat)}</i>` : ''}<i class="c">${esc(icon)}</i></span>` : '';
const liveDot = () => `<span class="livedot${Date.now() - (S.lastOk || 0) < 8000 ? ' on' : ''}" id="livedot"><i></i>${VER}</span>`;
const joinUrl = () => location.origin + location.pathname + (QS.get('api') ? '?api=' + encodeURIComponent(QS.get('api')) : '');
const shortUrl = () => (location.host + location.pathname).replace(/\/$/, '');
const snow = () => Date.now() + S.off;

/* ---------- network ---------- */
async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function send(body) {
  for (let i = 0; i < 4; i++) {
    try {
      const r = await post(body);
      if (r && (r.ok || r.error)) return r;
    } catch (e) {}
    await sleep(600 * (i + 1) + Math.random() * 400);
  }
  return { error: 'network' };
}
const admin = (op, extra) => send(Object.assign({ a: 'admin', key: S.key, op }, extra || {}));
let polling = false, seq = 0, applied = 0, lastSig = '';
async function poll(force) {
  if (API.startsWith('PASTE')) { S.loaded = true; render(); return; }
  if (polling && !force) return;
  if (document.hidden && !force && view() !== 'screen') return;
  polling = true; const my = ++seq;
  try {
    const r = await fetch(API + '?a=state&full=' + (view() === 'screen' ? 1 : 0) + '&pid=' + encodeURIComponent(S.pid) + '&t=' + Date.now());
    const d = await r.json();
    if (d.error) { S.netErr = 'หลังบ้านตอบกลับว่า · Server error: ' + d.error; S.loaded = true; render(); return; }
    if (my < applied) return; applied = my;
    const prevStage = S.st.stage;
    S.netErr = ''; S.lastOk = Date.now(); S.off = (d.now || Date.now()) - Date.now();
    S.st = d.state || S.st; S.players = d.players || []; S.total = d.total || 0; S.byTag = d.byTag || {};
    S.edges = d.edges || []; S.words = d.words || []; S.groups = d.groups || [];
    S.me = d.me || null;
    if (S.pid && !d.me) { S.pid = ''; lsSet('rf27_pid', ''); S.editing = false; }
    S.loaded = true;
    if (view() === 'screen') syncScene(); else checkInbox();
    const sig = JSON.stringify([d.state, d.players, d.me, d.total, S.edges.map(e => e.k).join(), d.words, d.groups]);
    if (force || sig !== lastSig) {
      lastSig = sig;
      if (view() === 'me' && typingNow() && prevStage === S.st.stage) S.dirty = true; else render();
    }
  } catch (e) { S.netErr = 'เชื่อมต่อไม่ได้ · Cannot connect (' + (e.message || e) + ')'; S.loaded = true; render(); }
  finally { polling = false; }
}
function typingNow() { const a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.closest('#app')); }

/* ---------- paper notes ---------- */
function noteE(e) { // a thank-you on the big screen
  const t = tg(e.g);
  return `<div class="note" style="--td:${t.d};--rot:${rot(e.k)}deg"><div class="to">ถึง ${av(e.ti, e.th, 28)} <b>${esc(e.tn)}</b></div><p>${esc(e.x)}</p><div class="from">— ${av(e.fi, e.fh, 24)} ${esc(e.fn)}<span class="stamp">${t.ic} ${e.g}</span></div></div>`;
}
function noteIn(x) { // a thank-you I received
  const t = tg(x.tag);
  return `<div class="note" style="--td:${t.d};--rot:${rot(x.k)}deg"><div class="to">ถึง <b>${esc(S.me ? S.me.name : '')}</b></div><p>${esc(x.text)}</p><div class="from">— ${av(x.fromIcon, x.fromHat, 26)} ${esc(x.from)}${x.fromTeam ? ' · ' + esc(x.fromTeam) : ''}<span class="stamp">${t.ic} ${x.tag}</span></div></div>`;
}

/* ---------- inbox toast (phone) ---------- */
let toastT = 0;
function checkInbox() {
  if (!S.me) return;
  const n = S.me.inbox.length, key = 'rf27_seen_' + S.me.id, seen = +lsGet(key) || 0;
  if (n > seen) {
    const x = S.me.inbox[n - 1], el = $('#toast');
    el.innerHTML = `<div data-toast><div class="toast-h">💌 มีโน้ตขอบคุณถึงคุณ!${n - seen > 1 ? ' (+' + (n - seen) + ')' : ''}<small>You got a thank-you note · แตะเพื่อเปิด · tap to open</small></div>${noteIn(x)}</div>`;
    el.classList.add('on');
    try { navigator.vibrate && navigator.vibrate([90, 50, 90]); } catch (e) {}
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 12000);
  }
  if (n !== seen) lsSet(key, String(n));
}

/* ---------- phone views ---------- */
function phoneTop() {
  return `<div class="top"><span class="kick" style="font-size:15px;letter-spacing:.12em;white-space:nowrap">2026 → 2027</span><div class="toprt"><span class="offpill">กำลังเชื่อมต่อใหม่… · Reconnecting</span>${S.me ? `<button class="mechip" data-editme aria-label="แก้ตัวละคร · Edit character">${av(S.me.icon, S.me.hat, 20)} ${esc(S.me.name)} ✎</button>` : ''}</div></div>`;
}
function joinView(edit) {
  if (!S.d.icon) S.d.icon = CHARS[Math.floor(Math.random() * CHARS.length)];
  if (!('hat' in S.d)) S.d.hat = HATS[Math.floor(Math.random() * HATS.length)];
  const hero = edit ? '<h1 style="margin-top:4px">แก้ตัวละคร<span class="en">Edit my character</span></h1>'
    : `<div class="hero join"><h1 class="disp">THANK YOU<br>FOR MAKING US<span>STRONGER · FASTER · BETTER</span></h1>
      <p class="muted">สร้างตัวละครของคุณ แล้วมาอยู่ด้วยกันบนจอใหญ่</p></div>`;
  return `${hero}<div class="card"><div class="preview">${av(S.d.icon, S.d.hat, 96)}<div class="nm">${esc(draft('name')) || '&nbsp;'}</div></div>
  <label>1. เลือกตัวละคร<span class="en">Pick your character</span></label><div class="pick">${CHARS.map(c => `<button data-icon="${c}" aria-pressed="${S.d.icon === c}">${c}</button>`).join('')}</div>
  <label>2. เลือกไอเท็มบนหัว<span class="en">Pick an item for your head</span></label><div class="pick">${HATS.map(c => `<button data-hat="${c}" aria-pressed="${S.d.hat === c}">${c}</button>`).join('')}<button class="none" data-hat="" aria-pressed="${!S.d.hat}">ไม่ใส่<br>None</button></div>
  <label for="nm">3. ชื่อที่จะแสดงบนจอ<span class="en">Display name</span></label><input type="text" id="nm" data-d="name" maxlength="24" autocomplete="nickname" value="${esc(draft('name'))}">
  <label for="tm">ทีม / หน่วยงาน (ไม่บังคับ)<span class="en">Team (optional)</span></label><input type="text" id="tm" data-d="team" maxlength="30" value="${esc(draft('team'))}">
  <div class="row">${edit ? `<button class="btn" data-saveme ${S.busy ? 'disabled' : ''}>บันทึก · Save</button><button class="btn ghost" data-cancelme>ยกเลิก · Cancel</button>` : `<button class="btn" data-join ${S.busy ? 'disabled' : ''}>${S.busy ? 'กำลังเข้า… · Joining…' : 'เข้าร่วม · Join ✨'}</button>`}</div>${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}</div>`;
}
function lobbyMe() {
  return `<div class="hero">${av(S.me.icon, S.me.hat, 110)}<div class="hello" style="margin-top:8px">สวัสดี ${esc(S.me.name)}!</div><p>ตัวละครของคุณมาอยู่บนจอใหญ่แล้ว ลองหาดูสิ<span class="en">You're on the big screen. Can you spot yourself?</span></p><div class="banner" style="margin:14px 0 0">⏳ รอผู้ดำเนินรายการเริ่ม แล้วช่องเขียนโน้ตขอบคุณจะขึ้นที่หน้านี้เอง<span class="en">The thank-you note form appears here when the facilitator starts</span></div></div>
  <div class="card"><div class="kick">ระหว่างรอ · WHILE WE WAIT</div><p class="hand" style="font-size:21px;margin:6px 0 0;color:#FFE7BF">ลองนึกถึงใครสักคน ที่ทำให้ปี 2026 ของคุณ…</p><p class="muted" style="margin:0 0 4px;font-size:14px">Think of someone who made your 2026…</p>
  ${TK.map(t => `<div class="tline" style="--tc:${TAGS[t].c}"><span class="ic">${TAGS[t].ic}</span><div><b>${t}</b>${TAGS[t].th}<span class="en">${TAGS[t].en}</span></div></div>`).join('')}</div>`;
}
function suggHTML() {
  const raw = (S.d.q || '').trim(), q = raw.toLowerCase();
  if (!q) return `<p class="hint">เลือกได้ทั้งเพื่อนในห้อง ทีม หรือคนที่ไม่ได้มาวันนี้<span class="en">A colleague in the room, a team, or someone who isn't here today</span></p>`;
  const list = S.players.filter(p => p.id !== S.me.id && (p.name.toLowerCase().includes(q) || (p.team || '').toLowerCase().includes(q))).slice(0, 8);
  return list.map(p => `<button data-pick="${esc(p.id)}"><span>${av(p.icon, p.hat, 26) || '✦'} ${esc(p.name)}</span><small>${esc(p.team)}</small></button>`).join('')
    + `<button data-pickext class="ext"><span>＋ “${esc(raw)}”</span><small>ทีม / คนที่ไม่ได้อยู่ในห้อง<br>Team / not in the room</small></button>`;
}
function composeView() {
  const sent = S.me.sent || [], to = S.d.to, tag = S.d.tag || '';
  let h = `<div class="card">`;
  if (sent.length >= MAX_SENT) h += `<p class="hand" style="font-size:21px">ส่งครบ ${MAX_SENT} โน้ตแล้ว ขอบคุณที่ใจดีขนาดนี้ 💛<span class="en">You've sent ${MAX_SENT} notes. Thank you for being so generous!</span></p>`;
  else {
    h += `<div class="step"><span class="num">1</span><span>โน้ตนี้ถึงใคร?<span class="en">Who is this note for?</span></span></div>`;
    h += to ? `<div class="picked"><span>${to.icon ? av(to.icon, to.hat, 28) : '✦'} ${esc(to.name)}${to.team ? `<small>${esc(to.team)}</small>` : ''}${to.ext ? '<small>ทีม / คนที่ไม่ได้อยู่ในห้อง · Team / not in the room</small>' : ''}</span><button class="x" data-unpick aria-label="เปลี่ยนคน · Change">✕</button></div>`
      : `<input type="text" id="q" data-d="q" placeholder="พิมพ์ชื่อคน หรือชื่อทีม · Type a name or team" autocomplete="off" value="${esc(draft('q'))}"><div id="sugg" class="sugg">${suggHTML()}</div>`;
    h += `<div class="step"><span class="num">2</span><span>เขาทำให้เรา…<span class="en">They made us…</span></span></div>`;
    h += TK.map(t => `<button class="tagb" data-tag="${t}" aria-pressed="${tag === t}" style="--tc:${TAGS[t].c}"><span class="ic">${TAGS[t].ic}</span><span><b>${t}</b>${TAGS[t].en}<small>${TAGS[t].th}</small></span></button>`).join('');
    h += `<div class="step"><span class="num">3</span><label for="msg" style="margin:0">เขียนโน้ตขอบคุณ (1–2 ประโยค)<span class="en">Write your thank-you note (1–2 sentences)</span></label></div>
    <textarea id="msg" class="paper" data-d="msg" maxlength="220" placeholder="${esc(tag ? TAGS[tag].ph : 'ขอบคุณที่…')}">${esc(draft('msg'))}</textarea>
    <div class="row"><button class="btn" data-send ${S.busy ? 'disabled' : ''}>${S.busy ? 'กำลังส่ง… · Sending…' : 'ส่งโน้ตขอบคุณ 💌 Send'}</button>${S.flash ? `<span class="saved">${esc(S.flash)}</span>` : ''}</div>
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}<p class="hint">โน้ตอาจขึ้นจอใหญ่ · ส่งให้ได้หลายคน<br>Your note may appear on the big screen · Send as many as you like</p>`;
  }
  h += `</div>`;
  if (sent.length) h += `<div class="card"><div class="kick">โน้ตที่ส่งแล้ว · SENT (${sent.length})</div>${sent.slice().reverse().map(x => `<div class="mini" style="--tc:${tg(x.tag).c}"><div><b>${esc(x.toName)}</b> · <span class="tg">${tg(x.tag).ic} ${x.tag}</span><p>${esc(x.text)}</p></div><button class="x" data-del="${esc(x.k)}" aria-label="ลบ · Delete">✕</button></div>`).join('')}</div>`;
  return h;
}
function inboxView() {
  const ib = (S.me.inbox || []).slice().reverse();
  let h = ib.length ? ib.map(noteIn).join('')
    : `<div class="card center"><p class="hand" style="font-size:20px;margin:0">ยังไม่มีโน้ตถึงคุณ เมื่อมีคนขอบคุณคุณ มือถือจะแจ้งเตือนทันที 💌</p><p class="muted" style="margin:4px 0 0;font-size:14px">Your phone will buzz when a note arrives.</p></div>`;
  h += `<div class="card"><div class="kick">KEEP IT · เก็บไว้</div><label for="em">ส่งโน้ตขอบคุณทั้งหมดที่ได้รับเข้าอีเมลของฉัน<span class="en">Email all my thank-you notes to me</span></label>
  <input type="email" id="em" data-d="email" autocomplete="email" value="${esc(draft('email'))}" placeholder="name@company.com">
  <div class="row"><button class="btn ghost" data-mail ${S.busy ? 'disabled' : ''}>ส่งเข้าอีเมล · Email me</button>${S.mailMsg ? `<span class="saved">${esc(S.mailMsg)}</span>` : ''}</div></div>`;
  return h;
}

/* ---------- render ---------- */
function render() {
  S.dirty = false;
  const scr = view() === 'screen';
  document.body.classList.toggle('screen', scr);
  document.body.classList.toggle('admin', scr && S.admin);
  document.body.classList.toggle('pu', !scr && !!S.me && S.st.stage === 'finale');
  document.body.dataset.stage = S.st.stage;
  const a = document.activeElement, fid = a && a.id;
  let s0 = null, s1 = null;
  try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) {}
  $('#app').innerHTML = scr ? screenView() : meView();
  if (fid) { const n = document.getElementById(fid); if (n && n !== document.body) { n.focus(); try { if (s0 != null) n.setSelectionRange(s0, s1); } catch (e) {} } }
  document.querySelectorAll('[data-qr]').forEach(el => {
    const size = +el.dataset.qr || 200;
    if (window.QRCode) new QRCode(el, { text: joinUrl(), width: size, height: size, colorDark: '#021338', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    else el.textContent = joinUrl();
  });
  tickCountdowns();
  if (!scr && S.st.stage === 'finale') wake();
}
function tickCountdowns() {
  document.querySelectorAll('[data-until]').forEach(el => {
    const left = Math.max(0, Math.ceil((+el.dataset.until - snow()) / 1000));
    el.textContent = left > 0 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'สลับ! · SWITCH';
    el.classList.toggle('out', left === 0);
  });
}
let wl = null;
async function wake() { try { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {} }

/* ---------- actions ---------- */
async function act(fn) { if (S.busy) return; S.busy = true; S.err = ''; render(); try { await fn(); } finally { S.busy = false; render(); } }
const ERR = { max: 'ส่งครบ ' + MAX_SENT + ' โน้ตแล้ว · Limit reached', self: 'ขอบคุณตัวเองไม่ได้นะ 😊 · You can’t thank yourself', incomplete: 'กรอกให้ครบ 3 ข้อ · Please complete all 3 steps', noperson: 'ไม่พบคนนี้ ลองเลือกใหม่ · Person not found', network: 'ส่งไม่สำเร็จ ลองอีกครั้ง · Could not send, try again', bademail: 'อีเมลไม่ถูกต้อง · Invalid email', wait: 'รอสักครู่แล้วลองใหม่ · Please wait a moment', badkey: 'Admin key ไม่ถูกต้อง · Wrong admin key' };
const errText = r => ERR[r && r.error] || ('เกิดข้อผิดพลาด · Error: ' + ((r && r.error) || '?'));
function flash(m) { S.flash = m; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.flash = ''; render(); }, 3500); }

document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.d;
  if (!k) return;
  S.d[k] = e.target.value;
  if (k === 'q') { const sg = $('#sugg'); if (sg) sg.innerHTML = suggHTML(); }
  if (k === 'name') { const pv = $('.preview .nm'); if (pv) pv.textContent = e.target.value || ' '; }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.dirty && !typingNow()) render(); }, 450); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ak') { e.preventDefault(); $('[data-key]').click(); return; }
  if (e.key === 'Enter' && e.target.id === 'nm') { e.preventDefault(); const b = $('[data-join]') || $('[data-saveme]'); if (b) b.click(); return; }
  if (view() !== 'screen' || !S.admin || typingNow()) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); advance(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); advance(-1); }
  else if (e.key === 's' || e.key === 'S') spotlight();
  else if (e.key === 'h' || e.key === 'H' || e.key === 'Escape') { if (S.showQR) { S.showQR = false; render(); } else hide(); }
  else if (e.key === 'q' || e.key === 'Q') { S.showQR = !S.showQR; render(); }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-show],[data-toast],[data-qr-close]');
  if (!t) return;
  const D = t.dataset;
  if ('toast' in D) { $('#toast').classList.remove('on'); S.tab = 'inbox'; if (S.st.stage === 'thanks' || S.st.stage === 'spot') { render(); window.scrollTo(0, 0); } return; }
  if ('qrClose' in D) { S.showQR = false; render(); return; }
  if ('join' in D) {

    if (nd.pulse && now - nd.pulse < 1400) { const p = (now - nd.pulse) / 1400; x.strokeStyle = hexA(nd.pcol || '#FFC56E', 1 - p); x.lineWidth = 3; x.beginPath(); x.arc(nd.x, nd.y, 14 + p * 40, 0, 6.283); x.stroke(); }
    x.globalCompositeOperation = 'source-over';
    if (labels && !fin) { x.font = '400 15px Sriracha, Kanit, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'top'; x.fillStyle = 'rgba(255,231,191,.95)'; x.fillText(nd.label.length > 22 ? nd.label.slice(0, 21) + '…' : nd.label, nd.x, nd.y + 14); }
  }
  // the people
  const ppl = [...C.nodes.values()].filter(nd => nd.kind === 'p' && nd.x != null).sort((a, b) => a.y - b.y);
  for (const nd of ppl) {
    const born = Math.min(1, (now - nd.born) / 700);
    const pop = born < 1 ? 0.3 + 0.7 * (1 - Math.pow(1 - born, 3)) + 0.12 * Math.sin(born * Math.PI) : 1;
    const cs = nd.cs * pop * (litIds.has(nd.id) ? 1.25 : 1);
    const jt = nd.jump ? (now - nd.jump) / 700 : 2, jy = jt < 1 ? -Math.sin(jt * Math.PI) * cs * 0.45 : 0;
    const bob = Math.sin(now / 1100 + nd.tw) * 1.5;
    x.globalCompositeOperation = 'source-over';
    if (nd.n > 0 || fin) {
      x.globalCompositeOperation = 'lighter';
      const z = cs * (1.3 + Math.min(1.4, (nd.n || 0) * 0.18)) * (0.9 + 0.1 * Math.sin(now / 800 + nd.tw));
      x.drawImage(sprite('#FFC56E'), nd.x - z / 2, nd.y - z / 2 + jy, z, z);
    }
    if (nd.pulse && now - nd.pulse < 1400) { const p = (now - nd.pulse) / 1400; x.globalCompositeOperation = 'lighter'; x.strokeStyle = hexA(nd.pcol || '#FFC56E', 1 - p); x.lineWidth = 3; x.beginPath(); x.arc(nd.x, nd.y + jy, cs * 0.55 + p * 42, 0, 6.283); x.stroke(); }
    x.globalCompositeOperation = 'source-over';
    const s = cs / 100;
    x.drawImage(charSprite(nd.icon || '🙂', nd.hat || ''), nd.x - 64 * s, nd.y - 112 * s + jy + bob, 128 * s, 168 * s);
    if (labels && (!many || nd.n > 0 || now - nd.born < 8000 || litIds.has(nd.id))) {
      const fs = Math.round(Math.max(11, Math.min(18, cs * 0.3)));
      x.font = `400 ${fs}px Kanit, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'top'; x.fillStyle = 'rgba(242,246,255,.92)';
      x.fillText(nd.label.length > 12 ? nd.label.slice(0, 11) + '…' : nd.label, nd.x, nd.y + cs * 0.5 + 2);
    }
  }
  // a heart travels from the sender to the person they thank
  C.anims = C.anims.filter(an => {
    const p = (now - an.t0) / 1700;
    if (p < 0) return true;
    const a = C.nodes.get(an.e.f), b = C.nodes.get(an.e.t);
    if (!a || !b || a.x == null || b.x == null) { const s = C.stars.get(an.e.k); if (s) s.born = now; return false; }
    const [p0, c, p1] = arcOf(a, b), t = tg(an.e.g), q = Math.min(1, p), ez = q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
    x.globalCompositeOperation = 'lighter'; x.lineCap = 'round'; x.strokeStyle = hexA(t.c, 0.85); x.lineWidth = 3;
    x.beginPath(); x.moveTo(p0.x, p0.y);
    for (let i = 1; i <= 24; i++) { const pt = bez(p0, c, p1, ez * i / 24); x.lineTo(pt.x, pt.y); }
    x.stroke();
    const hd = bez(p0, c, p1, ez);
    x.drawImage(sprite(t.c), hd.x - 30, hd.y - 30, 60, 60);
    x.globalCompositeOperation = 'source-over'; x.font = '24px ' + EMOJI_FONT; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t.hr, hd.x, hd.y);
    if (p >= 1) { b.pulse = now; b.pcol = t.c; b.jump = now; return false; }
    return true;
  });
  // ...and a spark rises to become a new star
  x.globalCompositeOperation = 'lighter';
  C.sparks = C.sparks.filter(sp => {
    const p = (now - sp.t0) / 1000, to = starXY(sp.k, g);
    if (p >= 1) { const s = C.stars.get(sp.k); if (s) s.born = now; return false; }
    const e = 1 - Math.pow(1 - p, 2);
    x.drawImage(sprite(sp.col), sp.from.x + (to.x - sp.from.x) * e - 11, sp.from.y + (to.y - sp.from.y) * e - 11, 22, 22);
    return true;
  });
  x.globalCompositeOperation = 'source-over';
}
function frame(now) { requestAnimationFrame(frame); draw(now); }

/* ---------- phones-up sync glow ---------- */
function puLoop() {
  requestAnimationFrame(puLoop);
  if (!document.body.classList.contains('pu')) return;
  const p = (snow() % 2400) / 2400;
  document.body.style.setProperty('--g', (0.25 + 0.75 * Math.pow(Math.sin(p * Math.PI), 2)).toFixed(3));
}

/* ---------- boot ---------- */
window.addEventListener('hashchange', () => location.reload());
(async function boot() {
  if (view() === 'screen') {
    resize(); window.addEventListener('resize', () => { resize(); render(); });
    try { await document.fonts.load('20px Sriracha'); } catch (e) {}
    requestAnimationFrame(frame);
    if (S.key && !API.startsWith('PASTE')) { try { const r = await post({ a: 'admin', key: S.key, op: 'ping' }); S.admin = !!(r && r.ok); } catch (e) {} }
  } else requestAnimationFrame(puLoop);
  await poll(true);
  // phones poll slower as the room fills up, to stay inside Apps Script limits
  (function loop() { setTimeout(async () => { await poll(); loop(); }, view() === 'screen' ? 2000 : Math.min(6000, 2500 + S.players.length * 20) + Math.random() * 800); })();
  setInterval(tickCountdowns, 250);
  setInterval(() => {
    const on = Date.now() - (S.lastOk || 0) < 9000;
    const d = $('#livedot'); if (d) d.classList.toggle('on', on);
    document.body.classList.toggle('offline', S.loaded && !on && !API.startsWith('PASTE'));
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(true); });
})();
</script>
